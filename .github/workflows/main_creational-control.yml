name: Build and deploy ASP.NET Core app to Azure Web App - creational-control

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build apps/Creational.Dataflow/Creational.Dataflow.csproj --configuration Release

      - name: Publish
        run: dotnet publish apps/Creational.Dataflow/Creational.Dataflow.csproj --configuration Release --output ./publish

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download publish output
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F5F1A602B44F4A2D96E4BF9BE88DC07F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A0F52522B978479FBFC900F648BD3467 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_062E5055F7A7492185DFAF01C389C0F2 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: creational-control
          slot-name: Production
          package: ./publish
